apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastapiapp.fullname" . }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      location /api/v1/movies {
        proxy_pass http://{{ include "fastapiapp.fullname" . }}-movie:8000/api/v1/movies;
      }
      location /api/v1/casts {
        proxy_pass http://{{ include "fastapiapp.fullname" . }}-cast:8000/api/v1/casts;
      }
    }