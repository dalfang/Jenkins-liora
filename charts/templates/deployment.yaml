{{- range $name, $service := dict "movie" .Values.movieService "cast" .Values.castService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapiapp.fullname" $ }}-{{ $name }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastapiapp.fullname" $ }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastapiapp.fullname" $ }}-{{ $name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URI
              value: {{ printf "postgresql://%s:%s@%s-db/%s" (index $.Values.database $name).user (index $.Values.database $name).password $name (index $.Values.database $name).name | quote }}
            {{- if eq $name "movie" }}
            - name: CAST_SERVICE_HOST_URL
              value: {{ printf "http://%s-cast:8000/api/v1/casts/" (include "fastapiapp.fullname" $) | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/checkapi
              port: 8000
          livenessProbe:
            httpGet:
              path: /api/v1/checkapi
              port: 8000
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapiapp.fullname" . }}-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastapiapp.fullname" . }}-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastapiapp.fullname" . }}-nginx
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "fastapiapp.fullname" . }}-nginx