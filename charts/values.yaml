nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

movieService:
  image:
    repository: dalfang/movie-service
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1

castService:
  image:
    repository: dalfang/cast-service
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1

database:
  image: postgres:12.1-alpine
  movie:
    user: movie_db_username
    password: movie_db_password
    name: movie_db_dev
  cast:
    user: cast_db_username
    password: cast_db_password
    name: cast_db_dev

nginx:
  image: nginx:1.27-alpine
  service:
    type: NodePort
    port: 8080
    nodePort: null

# Retained for the generated chart notes template; the Nginx gateway is the public service.
service:
  type: NodePort
  port: 8080

serviceAccount:
  create: false
  annotations: {}
  name: ""

ingress:
  enabled: false

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
